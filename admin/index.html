<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Sanskriti Art Admin</title>
  <link rel="icon" href="/assets/feathers/peacock-feather.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Allura&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,600&family=Jost:wght@400;500&display=swap" />
  <link rel="stylesheet" href="/admin/static/admin.css" />
  <script src="/src/admin-hotkey.js" defer></script>
  <script src="/admin/static/app.js" type="module"></script>
</head>
<body class="admin">
  <a class="skip-link" href="#view">Skip to content</a>
  <div class="shell">
    <aside class="sidebar" id="sidebar" data-sidebar aria-label="Admin navigation">
      <a class="brand brand--admin" href="/admin/dashboard" data-link aria-label="Sanskriti Art admin dashboard">
        <img class="brand__feather" src="/assets/feathers/peacock-feather.svg" alt="" width="320" height="820" />
        <span class="brand__mark" aria-hidden="true">SK</span>
        <span class="brand__name" aria-hidden="true">Sanskriti Art</span>
      </a>
      <nav class="nav" data-nav></nav>
      <div class="sidebar__art" aria-hidden="true">
        <p>Preserving<br />Your Precious<br />Moments<br />Into Art <span>♥</span></p>
      </div>
      <div class="sidebar__profile">
        <span class="avatar" data-avatar>S</span>
        <span class="sidebar__who"><strong data-admin-name>Sanskriti</strong><small data-admin-email></small></span>
        <button class="icon-btn" type="button" data-logout aria-label="Log out" title="Log out">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3M10 17l5-5-5-5M15 12H4"/></svg>
        </button>
      </div>
    </aside>
    <div class="scrim" data-scrim hidden></div>

    <div class="main">
      <header class="topbar">
        <button class="icon-btn topbar__menu" type="button" data-menu aria-label="Open menu" aria-controls="sidebar" aria-expanded="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
        <div class="search" role="search">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg>
          <input type="search" placeholder="Search products, orders, customers…" aria-label="Search products, orders and customers" data-search autocomplete="off" />
          <div class="search__results" data-search-results hidden></div>
        </div>
        <span class="demo-pill" data-demo-pill hidden title="Phase 1: the admin uses demo data stored in this browser. Nothing is saved to the shop yet.">Demo data</span>
        <a class="icon-btn bell" href="/admin/orders?filter=pending" data-link aria-label="New orders" data-bell>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 16V11a6 6 0 1 1 12 0v5l1.5 2h-15Z"/><path d="M10 20a2 2 0 0 0 4 0"/></svg>
          <span class="bell__count" data-bell-count hidden></span>
        </a>
        <a class="topbar__profile" href="/admin/settings#account" data-link>
          <span class="avatar" data-avatar>S</span>
          <span class="topbar__who"><strong data-admin-name>Sanskriti</strong><small>Sanskriti Art</small></span>
        </a>
      </header>
      <main class="view" id="view" data-view tabindex="-1"></main>
    </div>
  </div>

  <div class="toasts" data-toasts aria-live="polite"></div>
  <dialog class="confirm" data-confirm>
    <form method="dialog" class="confirm__card">
      <h2 class="confirm__title" data-confirm-title></h2>
      <p class="confirm__msg" data-confirm-msg></p>
      <div class="confirm__actions">
        <button class="btn btn--ghost" value="cancel">Cancel</button>
        <button class="btn btn--primary" value="ok" data-confirm-ok>Confirm</button>
      </div>
    </form>
  </dialog>
</body>
</html>
